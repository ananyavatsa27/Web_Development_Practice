<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animation</title>

    <style>
        .box {
            height: 200px;
            width: 200px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: rgb(185, 19, 19);

            position: relative;
            top: 10px;
            left: 10px;

            animation-name: movieBox;
            animation-duration: 2s;
            animation-timing-function: infinite;
            animation-delay: 0s;
            animation-iteration-count: 5;
        }

        @keyframes movieBox {
            from {
                background-color: rgb(8, 6, 68);
            
            }

            to {
                
                background-color:rgb(162, 159, 180) ;
                transform: translate(1000px);
        }
    </style>
</head>

<body>

    <div class="box">Animation</div>

</body>

</html>
