<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Relative and Absolute</title>

    <style>
        .parent {
            background-color: rgb(12, 12, 5);
            padding: 20px;
            position: relative;
        }

        .box {
            height: 350px;
            width: 350px;
            margin: 30px;
        }

        #box-1 {
            background-color: rgb(228, 222, 222);
        }

        #box-2 {
            background-color: rgb(229, 225, 225);
            position: relative;
            left: 100px;
            top: 30px;
        }

        #box-3 {
            background-color: rgb(227, 216, 216);
            position: absolute;
            top: 50px;
            left: 500px;
        }
    </style>
</head>

<body>

    <div class="parent">

        <div id="box-1" class="box">I am box -1</div>

        <div id="box-2" class="box">I am Relative</div>

        <div id="box-3" class="box">I am Absolute</div>

    </div>

</body>

</html>
