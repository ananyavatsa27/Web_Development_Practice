<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration For</title>
</head>

<body>
    <style>
        .form-container {
            width: 250px; 
            background-color: rgb(153, 148, 151);
            border: 1px solid rgb(137, 132, 140);
            margin: 30px auto;
            border-radius: 5px;
            font-weight: 900;
            padding: 20px;
        }

    </style>


    <form class="form-container"  action="/register" method="post">
        <br>

        <label for="fullName">Full Name:</label>
        <br>
        <input type="text" id="fullName" name="fullName" required>
        <br>

        <br>
        <label for="email">Email:</label>
        <br>
        <input type="email" id="email" name="email" required>
        <br>

        <br>
        <label>Gender:</label>
        <input type="radio" value="male" id="male" name="gender" required>
        <label for="male">Male</label>
        <input type="radio" value="female" id="female" name="gender">
        <label for="female">Female</label>
        <br>

        <br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>
        <br>

        <br>
        <label for="file">Upload File:</label>
        <input type="file" id="file" name="file">
        <br>

        <br>
        <label for="branch">Branch:</label>
        <select name="branch" id="branch">
            <option value="cse">CSE</option>
            <option value="it">IT</option>
            <option value="ece">ECE</option>
        </select>
        <br>

        <br>
        <label>Select Skills:</label>

        <input type="checkbox" id="java" name="skills" value="java">
        <label for="java">Java</label>
        <input type="checkbox" id="javascript" name="skills" value="javascript">
        <label for="javascript">JavaScript</label>
        <br>


        <br>
        <button type="submit">Register</button>
        <br>
    </form>

    <br>

    <br>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/ESnrn1kAD4E?si=aDI-IjIrJJtydOXK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
